<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a02"/>
      <stop offset="50%" stop-color="#351a05"/>
      <stop offset="100%" stop-color="#0d0501"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- FFT Spectral Oscilloscope Bars -->
  <g fill="url(#amberGlow)" filter="url(#glow)">
    <rect x="80" y="260" width="12" height="120" rx="3"/>
    <rect x="105" y="220" width="12" height="160" rx="3"/>
    <rect x="130" y="180" width="12" height="200" rx="3"/>
    <rect x="155" y="140" width="12" height="240" rx="3"/>
    <rect x="180" y="110" width="12" height="270" rx="3"/>
    <rect x="205" y="150" width="12" height="230" rx="3"/>
    <rect x="230" y="190" width="12" height="190" rx="3"/>
    <rect x="255" y="230" width="12" height="150" rx="3"/>
    <rect x="280" y="280" width="12" height="100" rx="3"/>
    <rect x="305" y="240" width="12" height="140" rx="3"/>
    <rect x="330" y="170" width="12" height="210" rx="3"/>
    <rect x="355" y="120" width="12" height="260" rx="3"/>
    <rect x="380" y="90" width="12" height="290" rx="3"/>
    <rect x="405" y="130" width="12" height="250" rx="3"/>
    <rect x="430" y="180" width="12" height="200" rx="3"/>
    <rect x="455" y="230" width="12" height="150" rx="3"/>
    <rect x="480" y="270" width="12" height="110" rx="3"/>
    <rect x="505" y="220" width="12" height="160" rx="3"/>
    <rect x="530" y="160" width="12" height="220" rx="3"/>
    <rect x="555" y="110" width="12" height="270" rx="3"/>
    <rect x="580" y="150" width="12" height="230" rx="3"/>
    <rect x="605" y="200" width="12" height="180" rx="3"/>
    <rect x="630" y="250" width="12" height="130" rx="3"/>
    <rect x="655" y="290" width="12" height="90" rx="3"/>
  </g>
  <!-- Time-domain Wave Trace -->
  <path d="M 60 200 Q 180 80 300 200 T 540 200 T 740 200" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="30" y="30" width="250" height="36" rx="8" fill="rgba(53, 26, 5, 0.8)" stroke="rgba(245, 158, 11, 0.3)"/>
  <text x="45" y="53" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b">WEB AUDIO API FFT SPECTRUM</text>
  <text x="770" y="420" font-family="monospace" font-size="12" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">AUDIO API • FFT OSCILLOSCOPE</text>
</svg>
