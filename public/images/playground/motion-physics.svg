<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0714"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#06020d"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="rgba(168, 85, 247, 0.12)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <!-- Velocity Vector Springs Wave -->
  <path d="M 50 225 Q 150 100 250 225 T 450 225 T 650 225 T 750 225" fill="none" stroke="url(#purpleGlow)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 50 225 Q 150 320 250 225 T 450 225 T 650 225 T 750 225" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Spring Nodes -->
  <g transform="translate(250, 225)" filter="url(#glow)">
    <circle r="36" fill="rgba(168, 85, 247, 0.35)" stroke="#a855f7" stroke-width="2.5"/>
    <circle r="10" fill="#ffffff"/>
  </g>
  <g transform="translate(450, 225)" filter="url(#glow)">
    <circle r="44" fill="rgba(236, 72, 153, 0.35)" stroke="#ec4899" stroke-width="2.5"/>
    <circle r="12" fill="#ffffff"/>
  </g>
  <g transform="translate(650, 225)" filter="url(#glow)">
    <circle r="28" fill="rgba(59, 130, 246, 0.35)" stroke="#3b82f6" stroke-width="2.5"/>
    <circle r="8" fill="#ffffff"/>
  </g>

  <rect x="30" y="30" width="240" height="36" rx="8" fill="rgba(30, 16, 53, 0.85)" stroke="rgba(168, 85, 247, 0.4)"/>
  <text x="45" y="53" font-family="monospace" font-size="12" font-weight="bold" fill="#a855f7">SPRING &amp; VELOCITY MOTION</text>
  <text x="770" y="420" font-family="monospace" font-size="12" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">FRAMER MOTION • GSAP • PHYSICS</text>
</svg>
