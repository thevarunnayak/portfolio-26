<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <path d="M 0 75 H 800 M 0 150 H 800 M 0 225 H 800 M 0 300 H 800 M 0 375 H 800"/>
    <path d="M 133 0 V 450 M 266 0 V 450 M 400 0 V 450 M 533 0 V 450 M 666 0 V 450"/>
  </g>
  <!-- 3D Torus Knot Geometry Wireframe Overlay -->
  <g transform="translate(400, 225)" filter="url(#glow)">
    <circle r="120" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
    <circle r="80" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
    <path d="M -90 -30 Q 0 -110 90 -30 Q 140 60 40 100 Q -60 120 -110 20 Z" fill="none" stroke="#818cf8" stroke-dasharray="4,4" stroke-width="2.5"/>
    <ellipse rx="130" ry="45" fill="none" stroke="#c084fc" stroke-width="2" transform="rotate(30)"/>
    <ellipse rx="130" ry="45" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-30)"/>
    <circle r="14" fill="#38bdf8" opacity="0.9"/>
  </g>
  <!-- Tech Tag Overlay -->
  <rect x="30" y="30" width="220" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)"/>
  <text x="45" y="53" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">3D / WEBGL SHADER LAB</text>
  <text x="770" y="420" font-family="monospace" font-size="12" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">THREE.JS • R3F • GLSL</text>
</svg>
