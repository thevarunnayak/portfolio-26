<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02120e"/>
      <stop offset="50%" stop-color="#052c23"/>
      <stop offset="100%" stop-color="#010a08"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Pub/Sub Data Pipeline Channels -->
  <g stroke="url(#emeraldGlow)" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M 100 120 C 300 120, 300 225, 500 225 C 650 225, 650 330, 720 330"/>
    <path d="M 100 225 H 720"/>
    <path d="M 100 330 C 300 330, 300 225, 500 225 C 650 225, 650 120, 720 120"/>
  </g>
  <!-- Packet Nodes -->
  <g fill="#10b981" filter="url(#glow)">
    <circle cx="200" cy="150" r="7"/>
    <circle cx="350" cy="225" r="9"/>
    <circle cx="480" cy="225" r="8"/>
    <circle cx="620" cy="290" r="7"/>
    <circle cx="280" cy="300" r="7"/>
  </g>
  <rect x="30" y="30" width="240" height="36" rx="8" fill="rgba(5, 44, 35, 0.8)" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="45" y="53" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">REAL-TIME RXJS DATA STREAM</text>
  <text x="770" y="420" font-family="monospace" font-size="12" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">RXJS • WEBSOCKETS • PUB/SUB</text>
</svg>
